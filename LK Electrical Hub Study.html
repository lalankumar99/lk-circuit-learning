<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#010205">
    <title>LK ELECTRICAL HUB | Premium Circuit Notes</title>
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">
    
    <!-- Tailwind CSS with Typography Plugin -->
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    
    <!-- Google Fonts: Outfit for UI, Share Tech Mono for Data -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" type="image/svg+xml" href="icon.svg">
    
    <!-- PrismJS syntax highlighting (For any raw text/data blocks in MD) -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Outfit', 'sans-serif'],
                        mono: ['Share Tech Mono', 'monospace'],
                    },
                    colors: {
                        navy: {
                            950: '#010205',
                            900: '#0a0f1c',
                            800: '#111827',
                            700: '#1e293b',
                        },
                        accent: {
                            400: '#ff5e00', // High Voltage Orange
                            500: '#e65500', 
                            600: '#cc4b00', 
                        },
                        electric: {
                            400: '#00e5ff', // Electric Blue
                            500: '#00b8cc', 
                        }
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.4s ease-out forwards',
                        'slide-up': 'slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                        'pop-in': 'popIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) forwards',
                        'pulse-glow': 'pulseGlow 2s infinite alternate',
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' }
                        },
                        slideUp: {
                            '0%': { opacity: '0', transform: 'translateY(20px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' }
                        },
                        popIn: {
                            '0%': { opacity: '0', transform: 'scale(0.95) translateY(10px)' },
                            '100%': { opacity: '1', transform: 'scale(1) translateY(0)' }
                        },
                        pulseGlow: {
                            '0%': { boxShadow: '0 0 5px rgba(255, 94, 0, 0.2)' },
                            '100%': { boxShadow: '0 0 20px rgba(255, 94, 0, 0.6)' }
                        }
                    }
                }
            }
        }
    </script>

    <style>
        /* Base Premium Styling */
        body { 
            background-color: #010205; 
            color: #f8fafc; 
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(255, 94, 0, 0.04) 0%, transparent 50%),
                radial-gradient(circle at 85% 30%, rgba(0, 229, 255, 0.04) 0%, transparent 50%);
            background-attachment: fixed;
        }
        
        /* Grid Pattern */
        .bg-grid {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(0, 229, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 229, 255, 0.03) 1px, transparent 1px);
            background-size: 30px 30px;
            z-index: -1;
            pointer-events: none;
        }

        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(30, 41, 59, 0.8); border-radius: 4px; border: 1px solid rgba(255,255,255,0.05); }
        ::-webkit-scrollbar-thumb:hover { background: #ff5e00; }

        /* Glassmorphism Components */
        .glass-panel {
            background: rgba(10, 15, 28, 0.7);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(0, 229, 255, 0.1);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }

        /* Spacious & Animated Card Styling */
        .glass-card {
            background: linear-gradient(145deg, rgba(10, 15, 28, 0.6) 0%, rgba(1, 2, 5, 0.8) 100%);
            border: 1px solid rgba(255, 94, 0, 0.15);
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }
        
        .glass-card:hover {
            transform: translateY(-5px) scale(1.02);
            border-color: rgba(0, 229, 255, 0.5);
            box-shadow: 0 20px 40px -10px rgba(0, 229, 255, 0.2);
            background: linear-gradient(145deg, rgba(10, 15, 28, 0.8) 0%, rgba(1, 2, 5, 0.95) 100%);
        }

        .glass-card:active {
            transform: translateY(2px) scale(0.98);
        }

        .gradient-text {
            background: linear-gradient(to right, #ff5e00, #ffb300);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Premium Search Input Styling */
        .search-glass {
            background: rgba(10, 15, 28, 0.6);
            border: 1px solid rgba(0, 229, 255, 0.2);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .search-glass:focus-within {
            background: rgba(10, 15, 28, 0.9);
            border-color: rgba(255, 94, 0, 0.6);
            box-shadow: 0 0 20px rgba(255, 94, 0, 0.2);
            transform: scale(1.01);
        }
        
        /* ==========================================================
           MODIFIED PREMIUM MARKDOWN VIEWER (ENGINEERING THEME)
           ========================================================== */
        .prose-premium {
            font-size: 1.15rem; 
            line-height: 1.8;
            color: #e2e8f0 !important; 
        }
        .prose-premium strong, .prose-premium b {
            color: #ffffff !important;
            font-weight: 700;
            text-shadow: 0 0 2px rgba(255,255,255,0.2);
        }
        
        /* Headers */
        .prose-premium h1, .prose-premium h2, .prose-premium h3, .prose-premium h4 {
            font-family: 'Outfit', sans-serif;
            font-weight: 800;
            margin-top: 2em;
            margin-bottom: 1em;
            line-height: 1.3;
        }
        .prose-premium h1 { 
            font-size: 2.75rem; 
            color: #ffffff !important; 
            border-bottom: 3px solid #00e5ff; 
            padding-bottom: 0.5rem; 
            box-shadow: 0 10px 10px -10px rgba(0, 229, 255, 0.3);
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .prose-premium h2 { 
            font-size: 2rem; 
            color: #ff5e00 !important; 
            border-bottom: 1px solid rgba(255, 94, 0, 0.3); 
            padding-bottom: 0.5rem;
            display: flex;
            align-items: center;
        }
        .prose-premium h2::before {
            content: "⚡";
            font-size: 1.2rem;
            margin-right: 10px;
            opacity: 0.8;
        }
        .prose-premium h3 { 
            font-size: 1.5rem; 
            color: #00e5ff !important;
        }

        /* Links */
        .prose-premium a { 
            color: #00e5ff !important; 
            text-decoration: none; 
            border-bottom: 1px dashed rgba(0, 229, 255, 0.6); 
            transition: all 0.2s;
        }
        .prose-premium a:hover { 
            color: #ff5e00 !important; 
            border-bottom-color: #ff5e00; 
            background: rgba(255, 94, 0, 0.1);
        }

        /* Lists */
        .prose-premium ul, .prose-premium ol { padding-left: 1.5rem; }
        .prose-premium li { margin-bottom: 0.5rem; }
        .prose-premium li::marker { color: #00e5ff !important; font-weight: bold; }

        /* Inline Code / Data representation */
        .prose-premium :where(code):not(:where([class~="not-prose"] *)) {
            background-color: rgba(0, 229, 255, 0.1);
            color: #00e5ff !important;
            padding: 0.1rem 0.4rem;
            border-radius: 0.25rem;
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.9em;
            border: 1px solid rgba(0, 229, 255, 0.2);
        }

        /* Blockquotes - Designed as Warning/Caution Panels */
        .prose-premium blockquote {
            border-left: 5px solid #ff5e00;
            background: linear-gradient(90deg, rgba(255, 94, 0, 0.15) 0%, rgba(255, 94, 0, 0.02) 100%);
            padding: 1.25rem 1.5rem;
            border-radius: 0 0.5rem 0.5rem 0;
            font-style: italic;
            color: #cbd5e1 !important;
            margin: 2rem 0;
            position: relative;
        }
        .prose-premium blockquote p { margin: 0; }

        /* Tables - Engineering Spec Sheet Style */
        .prose-premium table { 
            width: 100%; 
            text-align: left; 
            border-collapse: separate; 
            border-spacing: 0;
            margin: 2rem 0; 
            border: 1px solid rgba(0,229,255,0.3);
            border-radius: 0.5rem;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        .prose-premium thead { background: rgba(0, 229, 255, 0.1); }
        .prose-premium th { 
            padding: 1rem; 
            color: #00e5ff !important; 
            font-family: 'Share Tech Mono', monospace; 
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 2px solid rgba(0,229,255,0.4);
        }
        .prose-premium td { 
            padding: 1rem; 
            border-bottom: 1px solid rgba(255,255,255,0.05); 
        }
        .prose-premium tr:last-child td { border-bottom: none; }
        .prose-premium tr:hover td { background: rgba(255,255,255,0.02); }

        .prose-premium hr { border-color: rgba(255, 255, 255, 0.1); margin: 3rem 0; }
        
        .prose-premium img { 
            border-radius: 0.5rem; 
            max-width: 100%; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); 
            border: 1px solid rgba(0,229,255,0.2);
            margin: 2rem auto;
            display: block;
        }

        /* Fullscreen API Handlers */
        #viewer-wrapper:-webkit-full-screen {
            background-color: #010205 !important;
            border: none !important;
            border-radius: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            max-width: 100% !important;
            overflow-y: auto;
        }
        #viewer-wrapper:fullscreen {
            background-color: #010205 !important;
            border: none !important;
            border-radius: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            max-width: 100% !important;
            overflow-y: auto;
        }
        
        #viewer-wrapper:-webkit-full-screen .viewer-toolbar { display: none !important; }
        #viewer-wrapper:fullscreen .viewer-toolbar { display: none !important; }
        #viewer-wrapper:-webkit-full-screen .exit-fullscreen-btn { display: flex !important; }
        #viewer-wrapper:fullscreen .exit-fullscreen-btn { display: flex !important; }
        #viewer-wrapper:-webkit-full-screen .viewer-content { min-height: 100vh; padding: 3rem 2rem; }
        #viewer-wrapper:fullscreen .viewer-content { min-height: 100vh; padding: 3rem 2rem; }

        /* Professional Loader Customization */
        .professional-loader {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(0, 229, 255, 0.1);
            border-left-color: #00e5ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
    </style>
</head>
<body class="antialiased min-h-screen flex flex-col selection:bg-accent-400 selection:text-navy-900 relative">

    <div class="bg-grid"></div>

    <!-- Navigation Header -->
    <header class="glass-panel sticky top-0 z-50 w-full border-b border-accent-400/20" id="main-header">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex flex-col md:flex-row items-center justify-between h-auto md:h-24 py-4 md:py-0 gap-4">
                
                <!-- Logo / Title -->
                <div class="flex items-center gap-4 cursor-pointer group active:scale-95 transition-transform duration-300" onclick="window.location.href='home.html'">
                    <div class="bg-gradient-to-br from-accent-400 to-yellow-500 p-3 rounded-2xl shadow-[0_0_15px_rgba(255,94,0,0.4)] group-hover:shadow-[0_0_25px_rgba(255,94,0,0.7)] transition-all duration-300">
                        <i class="fa-solid fa-bolt text-3xl text-white"></i>
                    </div>
                    <div>
                        <h1 class="text-2xl md:text-3xl font-extrabold text-white tracking-wide font-mono">LK <span class="gradient-text">ELECTRIC</span></h1>
                        <p class="text-[11px] md:text-xs text-electric-400 font-bold tracking-[0.2em] uppercase opacity-80 mt-1">Circuit Documentation</p>
                    </div>
                </div>

                <!-- Global Search -->
                <div class="relative w-full md:w-[450px]">
                    <div class="relative search-glass rounded-2xl flex items-center">
                        <span class="pl-5 text-electric-400 text-lg">
                            <i class="fas fa-search"></i>

                        <input type="text" id="searchInput" 
                            class="w-full pl-4 pr-5 py-3.5 bg-transparent text-white placeholder-slate-500 focus:outline-none text-base font-medium font-mono"

                        <!-- Search Results Dropdown -->
                        <div id="searchResults" class="absolute top-full left-0 right-0 mt-3 glass-panel rounded-2xl hidden max-h-[450px] overflow-y-auto z-50 border border-electric-400/20 shadow-2xl">

    </header>

    <!-- Main Content Area -->
    <main class="flex-grow w-full max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10 relative">
        
        <!-- Breadcrumb Navigation -->
        <nav class="flex items-center space-x-3 text-sm text-slate-400 mb-10 overflow-x-auto whitespace-nowrap pb-2 font-medium custom-scrollbar font-mono uppercase" id="breadcrumb">
            <!-- Populated via JS -->
        </nav>

        <!-- Dynamic Content Container -->
        <div id="content-container" class="relative min-h-[500px]">
            <!-- Viewers and Cards will be injected here -->
        </div>

    </main>

    <!-- Footer -->
    <footer class="border-t border-accent-400/20 py-8 mt-auto glass-panel" id="main-footer">
        <div class="max-w-7xl mx-auto px-4 text-center">
            <p class="text-slate-400 text-sm font-medium font-mono">
                &copy; <span id="year"></span> LK Electric. <span class="block sm:inline mt-1 sm:mt-0 opacity-70 text-electric-400">Grid Fully Operational.</span>
            </p>
        </div>
    </footer>

    <!-- Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    
    <!-- PrismJS Core (Only for highlighting syntax if present in notes) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>

    <script>
        // --- Core Application Logic ---
        document.getElementById('year').textContent = new Date().getFullYear();

        // Updated GitHub Repository as requested
        const CONFIG = {
            owner: 'lalankumar99',
            repo: 'lk-circuit-learning',
            branch: 'main'
        };

        const state = {
            fullTree: [],
            currentPath: '',
            fileCache: {}
        };

        const elements = {
            container: document.getElementById('content-container'),
            breadcrumb: document.getElementById('breadcrumb'),
            searchInput: document.getElementById('searchInput'),
            searchResults: document.getElementById('searchResults')
        };
        
        // NO CODING SECTION: Only allowing documents/notes
        const ALLOWED_EXTENSIONS = ['.md', '.txt']; 
        
        // Folders to exclude
        const EXCLUDED_FOLDERS = ['app', 'icon', 'icons'];

        // Fullscreen API toggle helper
        window.toggleFullscreen = () => {
            const viewer = document.getElementById('viewer-wrapper');
            if (!viewer) return;
            
            if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                if (viewer.requestFullscreen) {
                    viewer.requestFullscreen().catch(err => console.error("Fullscreen error:", err));
                } else if (viewer.webkitRequestFullscreen) {
                    viewer.webkitRequestFullscreen(); 
                }
                if (screen.orientation && screen.orientation.lock) {
                    screen.orientation.lock('landscape').catch(() => {});
                }
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
                else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
            }
        };

        // --- Application Initialization ---
        async function initApp() {
            renderLoading('Syncing to Main Grid...');
            try {
                const response = await fetch(`https://api.github.com/repos/${CONFIG.owner}/${CONFIG.repo}/git/trees/${CONFIG.branch}?recursive=1`);
                if (!response.ok) throw new Error('Failed to connect to grid structure.');
                const data = await response.json();
                
                state.fullTree = data.tree.filter(item => {
                    if (item.path.startsWith('.') || item.path.includes('/.')) return false;
                    
                    const pathParts = item.path.split('/');
                    if (pathParts.some(part => EXCLUDED_FOLDERS.includes(part.toLowerCase()))) {
                        return false;
                    }
                    
                    if (item.type === 'tree') return true;
                    return ALLOWED_EXTENSIONS.some(ext => item.path.toLowerCase().endsWith(ext));
                });

                app.navigate('');
            } catch (error) {
                renderError('Grid connection lost. Please verify repository existence and internet connection.');
            }
        }

        // --- Formatting Helpers ---
        const utils = {
            formatName: (pathName) => {
                let name = pathName.split('/').pop();
                name = name.replace(/\.(md|txt)$/i, '');
                
                const unitMatch = name.match(/^(unit|phase)[-_]?(\d+)[-_]+(.*)$/i);
                if (unitMatch) {
                    const unitStr = unitMatch[1].charAt(0).toUpperCase() + unitMatch[1].slice(1).toLowerCase();
                    const num = unitMatch[2];
                    const rest = unitMatch[3].replace(/[-_]/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
                    return `${unitStr} ${num}: ${rest}`;
                }
                
                name = name.replace(/[-_]/g, ' ');
                return name.replace(/\b\w/g, l => l.toUpperCase());
            },
            
            getFileDetails: (filename) => {
                const ext = filename.split('.').pop().toLowerCase();
                if (ext === 'md' || ext === 'txt') return { icon: 'fa-solid fa-file-invoice', color: 'text-electric-400', bg: 'bg-electric-400/10', border: 'border-electric-400/30' };
                return { icon: 'fa-solid fa-folder-open', color: 'text-yellow-500', bg: 'bg-yellow-500/10', border: 'border-yellow-500/30' };
            },

            getChildren: (path) => {
                const prefix = path === '' ? '' : `${path}/`;
                return state.fullTree.filter(item => {
                    if (!item.path.startsWith(prefix)) return false;
                    const rem = item.path.substring(prefix.length);
                    return rem.length > 0 && !rem.includes('/');
                }).sort((a, b) => {
                    if (a.type !== b.type) return a.type === 'tree' ? -1 : 1;
                    return a.path.localeCompare(b.path);
                });
            }
        };

        // --- Navigation and View Rendering ---
        const app = {
            navigate: async (path) => {
                state.currentPath = path;
                elements.searchInput.value = '';
                elements.searchResults.classList.add('hidden');
                
                app.updateBreadcrumbs();
                const item = state.fullTree.find(i => i.path === path);
                
                elements.container.className = "relative min-h-[500px] opacity-0";
                
                if (item && item.type === 'blob') {
                    await app.renderFileViewer(item);
                } else {
                    app.renderFolderView(path);
                }
                
                setTimeout(() => {
                    elements.container.className = "relative min-h-[500px] animate-pop-in";
                }, 10);

                window.scrollTo({ top: 0, behavior: 'smooth' });
            },

            updateBreadcrumbs: () => {
                const parts = state.currentPath.split('/').filter(p => p);
                let html = `
                    <button onclick="app.navigate('')" class="hover:text-accent-400 transition-colors flex items-center gap-2 px-4 py-2 rounded-xl hover:bg-white/5 border border-transparent hover:border-white/10 active:scale-95 text-base">
                        <i class="fa-solid fa-network-wired"></i> Root Node
                    </button>
                `;

                let accumPath = '';
                parts.forEach((part, index) => {
                    accumPath += (accumPath ? '/' : '') + part;
                    const isLast = index === parts.length - 1;
                    const displayName = utils.formatName(part);
                    
                    html += `<i class="fa-solid fa-chevron-right text-[11px] text-slate-600 mx-1"></i>`;
                    
                    if (isLast) {
                        html += `<span class="px-4 py-2 text-electric-400 font-bold truncate max-w-[200px] sm:max-w-xs drop-shadow-[0_0_8px_rgba(0,229,255,0.4)] text-base" title="${displayName}">${displayName}</span>`;
                    } else {
                        html += `<button onclick="app.navigate('${accumPath}')" class="hover:text-white transition-colors px-4 py-2 rounded-xl hover:bg-white/5 border border-transparent hover:border-white/10 truncate max-w-[150px] sm:max-w-xs active:scale-95 text-base" title="${displayName}">${displayName}</button>`;
                    }
                });
                elements.breadcrumb.innerHTML = html;
            },

            renderFolderView: (path) => {
                const children = utils.getChildren(path);
                if (children.length === 0) return renderEmptyFolder();

                let html = `
                    <div class="mb-10 flex flex-row items-center gap-5">
                        ${path !== '' ? `
                            <button onclick="app.navigate('${path.split('/').slice(0, -1).join('/')}')" 
                                title="Go Back"
                                class="w-12 h-12 flex-shrink-0 bg-white/5 hover:bg-white/10 border border-electric-400/20 text-electric-400 hover:text-white rounded-2xl transition-all flex items-center justify-center hover:scale-105 active:scale-95 shadow-[0_0_10px_rgba(0,229,255,0.1)] group">
                                <i class="fa-solid fa-arrow-left text-lg group-hover:-translate-x-1 transition-transform"></i>
                            </button>
                        ` : ''}
                        <h2 class="text-2xl md:text-4xl font-extrabold text-white flex items-center gap-4 truncate" title="${utils.formatName(path)}">
                            ${path === '' ? 
                                '<div class="w-14 h-14 flex-shrink-0 rounded-2xl bg-gradient-to-br from-accent-500 to-yellow-500 flex items-center justify-center shadow-[0_0_15px_rgba(255,94,0,0.3)]"><i class="fa-solid fa-server text-white text-xl"></i></div> <span class="font-mono uppercase tracking-wider">System Directory</span>' 
                                : `<div class="w-14 h-14 flex-shrink-0 rounded-2xl bg-gradient-to-br from-electric-500 to-blue-600 flex items-center justify-center shadow-[0_0_15px_rgba(0,229,255,0.3)]"><i class="fa-solid fa-folder-tree text-white text-xl"></i></div> <span class="truncate font-mono uppercase tracking-wider">${utils.formatName(path)}</span>`}
                        </h2>
                    </div>
                    
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
                `;

                children.forEach(item => {
                    const isFolder = item.type === 'tree';
                    const name = utils.formatName(item.path);
                    const rawName = item.path.split('/').pop();
                    const details = isFolder ? utils.getFileDetails('folder') : utils.getFileDetails(item.path);

                    html += `
                        <div onclick="app.navigate('${item.path}')" 
                            class="glass-card rounded-2xl p-6 cursor-pointer group flex items-center gap-5 relative overflow-hidden min-h-[110px]" title="${rawName}">
                            
                            <div class="absolute -right-8 -top-8 w-28 h-28 ${details.bg} blur-3xl rounded-full opacity-0 group-hover:opacity-40 transition-opacity duration-500"></div>
                            <div class="absolute left-0 top-0 w-1 h-full bg-gradient-to-b from-transparent via-${isFolder ? 'yellow-500' : 'electric-400'} to-transparent opacity-0 group-hover:opacity-100 transition-opacity"></div>
                            
                            <div class="flex-shrink-0 w-14 h-14 rounded-2xl flex items-center justify-center border ${details.border} ${details.bg} group-hover:scale-110 transition-transform duration-300 shadow-md relative z-10">
                                <i class="${details.icon} ${details.color} text-2xl"></i>
                            </div>
                            <div class="flex-grow min-w-0 relative z-10">
                                <h3 class="text-base sm:text-lg font-bold text-slate-200 group-hover:text-white transition-colors truncate font-mono">
                                    ${name}
                                </h3>
                            </div>
                            <div class="flex-shrink-0 opacity-0 group-hover:opacity-100 transition-all duration-300 transform group-hover:translate-x-1 relative z-10">
                                <i class="fa-solid fa-chevron-right ${details.color} text-lg"></i>
                            </div>
                        </div>
                    `;
                });

                html += `</div>`;
                elements.container.innerHTML = html;
            },

            renderFileViewer: async (item) => {
                const parentPath = item.path.split('/').slice(0, -1).join('/');
                const fileName = item.path.split('/').pop();
                const rawUrl = `https://raw.githubusercontent.com/${CONFIG.owner}/${CONFIG.repo}/${CONFIG.branch}/${item.path}`;
                
                renderLoading(`Extracting Blueprint...`);
                
                try {
                    let content = state.fileCache[item.path];
                    if (!content) {
                        const response = await fetch(rawUrl);
                        if (!response.ok) throw new Error('Failed to fetch file');
                        content = await response.text();
                        state.fileCache[item.path] = content;
                    }
                    
                    // Rendering everything as Markdown/Notes (No Coding Section)
                    app.renderMarkdownViewer(fileName, parentPath, content);
                } catch (error) {
                    renderError(`Unable to load blueprint. Network error or file missing.`);
                }
            },

            renderMarkdownViewer: (fileName, parentPath, content) => {
                marked.setOptions({
                    breaks: true, gfm: true,
                    highlight: (code, lang) => Prism.languages[lang] ? Prism.highlight(code, Prism.languages[lang], lang) : code
                });

                const htmlContent = marked.parse(content);
                const title = utils.formatName(fileName);

                elements.container.innerHTML = `
                    <div class="w-full animate-slide-up">
                        <div id="viewer-wrapper" class="glass-panel border border-electric-400/20 rounded-3xl overflow-hidden shadow-[0_0_30px_rgba(0,229,255,0.1)] relative bg-navy-900/90">
                            
                            <!-- Notes Viewer Toolbar -->
                            <div class="viewer-toolbar bg-navy-800/95 px-5 py-4 border-b border-electric-400/20 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-5 backdrop-blur-xl z-10 relative">
                                <div class="flex items-center gap-4 w-full min-w-0">
                                    <button onclick="app.navigate('${parentPath}')" title="Go Back" class="flex-shrink-0 w-12 h-12 rounded-xl hover:bg-white/10 flex items-center justify-center text-slate-300 hover:text-white transition-all hover:scale-105 active:scale-95 bg-white/5 border border-white/10 shadow-md group">
                                        <i class="fa-solid fa-arrow-left text-lg group-hover:-translate-x-1 transition-transform"></i>
                                    </button>
                                    <div class="flex items-center gap-3 overflow-hidden">
                                        <div class="flex-shrink-0 w-12 h-12 rounded-xl bg-electric-400/10 border border-electric-400/30 flex items-center justify-center shadow-[0_0_10px_rgba(0,229,255,0.2)]">
                                            <i class="fa-solid fa-file-invoice text-electric-400 text-xl"></i>
                                        </div>
                                        <div class="min-w-0">
                                            <h2 class="text-white font-bold text-lg sm:text-xl leading-tight tracking-wide truncate font-mono" title="${fileName}">${title}</h2>
                                        </div>
                                    </div>
                                </div>
                                <div class="flex items-center gap-3 flex-shrink-0">
                                    <button onclick="toggleFullscreen()" title="Fullscreen" class="w-12 h-12 bg-white/5 hover:bg-white/10 border border-white/10 text-slate-300 hover:text-white rounded-xl transition-all flex items-center justify-center hover:shadow-lg hover:scale-105 active:scale-95">
                                        <i class="fa-solid fa-expand text-lg"></i>
                                    </button>
                                    <button onclick="app.downloadPDF('${title}')" id="pdfBtn" class="px-5 py-3 bg-gradient-to-r from-electric-500 to-blue-600 hover:from-electric-400 hover:to-blue-500 shadow-[0_0_15px_rgba(0,229,255,0.3)] text-white rounded-xl transition-all text-sm font-bold flex items-center justify-center gap-2 hover:scale-105 active:scale-95">
                                        <i class="fa-solid fa-download"></i> <span class="hidden sm:inline">Export PDF</span>
                                    </button>
                                </div>
                            </div>

                            <!-- Note Content Area - Styled as a Blueprint -->
                            <div class="viewer-content overflow-y-auto bg-[#010205] p-6 sm:p-10 md:p-16 relative">
                                <!-- Background circuit accents inside viewer -->
                                <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-transparent via-electric-400 to-transparent opacity-20"></div>
                                <div class="absolute top-0 left-10 w-px h-full bg-gradient-to-b from-electric-400 to-transparent opacity-10"></div>
                                
                                <div id="notes-export-area" class="max-w-5xl mx-auto bg-navy-900/80 rounded-3xl p-8 sm:p-14 md:p-20 border border-electric-400/20 shadow-[0_10px_40px_rgba(0,0,0,0.5)] relative z-10 backdrop-blur-sm">
                                    <div class="flex justify-between items-center border-b border-white/10 pb-4 mb-8">
                                        <span class="text-electric-400 font-mono text-sm uppercase tracking-widest font-bold flex items-center gap-2"><i class="fa-solid fa-circle-dot text-[10px] animate-pulse"></i> Document Live</span>
                                        <span class="text-slate-500 font-mono text-xs">SYS_ID: ${Math.floor(Math.random() * 90000) + 10000}</span>
                                    </div>
                                    <article class="prose prose-invert prose-premium w-full max-w-none">
                                        ${htmlContent}
                                    </article>
                                </div>
                            </div>
                            
                            <!-- Fullscreen Exit Floating Button -->
                            <button onclick="toggleFullscreen()" title="Exit Fullscreen" class="exit-fullscreen-btn fixed bottom-8 right-8 z-[9999] w-14 h-14 bg-black/70 backdrop-blur-xl border border-accent-400/50 rounded-full text-accent-400 hidden items-center justify-center hover:bg-accent-400 hover:text-white hover:scale-110 active:scale-95 transition-all shadow-[0_0_30px_rgba(255,94,0,0.6)]">
                                <i class="fa-solid fa-compress text-2xl"></i>
                            </button>
                        </div>
                    </div>
                `;
            },

            downloadPDF: (title) => {
                const btn = document.getElementById('pdfBtn');
                const originalHtml = btn.innerHTML;
                btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Processing...';
                btn.disabled = true;

                const element = document.getElementById('notes-export-area');
                
                const opt = {
                    margin:       [10, 5, 10, 5],
                    filename:     `${title.replace(/[^a-z0-9]/gi, '_').toLowerCase()}_document.pdf`,
                    image:        { type: 'jpeg', quality: 1.0 },
                    html2canvas:  { 
                        scale: 2, 
                        useCORS: true, 
                        backgroundColor: '#0a0f1c',
                        scrollY: 0
                    },
                    jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
                };

                html2pdf().set(opt).from(element).save().then(() => {
                    btn.innerHTML = originalHtml;
                    btn.disabled = false;
                }).catch(err => {
                    console.error("PDF Gen Error:", err);
                    alert("Error generating PDF.");
                    btn.innerHTML = originalHtml;
                    btn.disabled = false;
                });
            },

            handleSearch: (query) => {
                if (query.trim().length < 2) {
                    elements.searchResults.classList.add('hidden');
                    return;
                }
                const lowercaseQuery = query.toLowerCase();
                const results = state.fullTree.filter(item => {
                    const formattedName = utils.formatName(item.path).toLowerCase();
                    return formattedName.includes(lowercaseQuery) || item.path.toLowerCase().includes(lowercaseQuery);
                }).slice(0, 8); 

                if (results.length === 0) {
                    elements.searchResults.innerHTML = `<div class="p-6 text-center text-slate-400 font-medium font-mono">No matching documents found</div>`;
                } else {
                    let html = '<ul class="py-2">';
                    results.forEach(item => {
                        const isFolder = item.type === 'tree';
                        const details = isFolder ? utils.getFileDetails('folder') : utils.getFileDetails(item.path);
                        const parts = item.path.split('/');
                        const rawName = parts.pop();
                        const name = utils.formatName(rawName);
                        const parent = parts.join(' / ').replace(/[-_]/g, ' ');

                        html += `
                            <li>
                                <button onclick="app.navigate('${item.path}')" class="w-full text-left px-5 py-4 hover:bg-white/5 transition flex items-center gap-4 focus:outline-none focus:bg-white/10 group active:bg-white/10 border-b border-white/5" title="${rawName}">
                                    <div class="w-10 h-10 rounded-xl ${details.bg} border ${details.border} flex flex-shrink-0 items-center justify-center shadow-inner">
                                        <i class="${details.icon} ${details.color} text-lg"></i>
                                    </div>
                                    <div class="overflow-hidden">
                                        <div class="text-slate-200 font-bold text-base group-hover:text-white transition-colors truncate font-mono">${name}</div>
                                        ${parent ? `<div class="text-xs text-slate-500 mt-1 truncate font-mono opacity-70">${parent}</div>` : ''}
                                    </div>
                                </button>
                            </li>
                        `;
                    });
                    html += '</ul>';
                    elements.searchResults.innerHTML = html;
                }
                elements.searchResults.classList.remove('hidden');
            }
        };

        // --- UI Feedback Components ---
        function renderLoading(message) {
            elements.container.innerHTML = `
                <div class="flex flex-col items-center justify-center py-40 animate-pop-in">
                    <div class="professional-loader mb-8"></div>
                    <p class="text-electric-400 font-medium tracking-widest uppercase font-mono animate-pulse text-center px-4 text-sm">${message}</p>
                </div>
            `;
        }

        function renderError(message) {
            elements.container.innerHTML = `
                <div class="glass-panel border-accent-400/40 rounded-3xl p-10 sm:p-14 text-center max-w-2xl mx-auto mt-16 animate-slide-up relative overflow-hidden shadow-[0_0_40px_rgba(255,94,0,0.15)]">
                    <div class="absolute inset-0 bg-accent-500/5"></div>
                    <div class="relative z-10">
                        <div class="w-16 h-16 bg-accent-500/10 rounded-2xl border border-accent-500/30 flex items-center justify-center mx-auto mb-6 shadow-inner">
                            <i class="fa-solid fa-triangle-exclamation text-3xl text-accent-400 shadow-sm animate-pulse"></i>
                        </div>
                        <h3 class="text-2xl font-extrabold text-white mb-3 font-mono">System Fault Detected</h3>
                        <p class="text-slate-400 mb-8 text-base">${message}</p>
                        <button onclick="initApp()" class="px-8 py-3 bg-white/5 hover:bg-white/10 text-white rounded-xl transition-all text-base font-bold border border-white/10 flex items-center gap-3 mx-auto active:scale-95 hover:shadow-[0_0_15px_rgba(255,255,255,0.1)]">
                            <i class="fa-solid fa-rotate"></i> Reboot Connection
                        </button>
                    </div>
                </div>
            `;
        }

        function renderEmptyFolder() {
            elements.container.innerHTML = `
                <div class="glass-panel rounded-3xl p-16 sm:p-20 text-center max-w-2xl mx-auto mt-16 border-electric-400/10 animate-slide-up shadow-[0_0_30px_rgba(0,229,255,0.05)]">
                    <div class="w-24 h-24 bg-white/5 rounded-2xl flex items-center justify-center mx-auto mb-8 border border-white/10 shadow-inner">
                        <i class="fa-solid fa-box-open text-5xl text-slate-600"></i>
                    </div>
                    <h3 class="text-3xl font-extrabold text-white mb-3 font-mono">Empty Node</h3>
                    <p class="text-slate-400 text-lg">No documents found in this directory.</p>
                </div>
            `;
        }

        // --- Global Events ---
        elements.searchInput.addEventListener('input', (e) => app.handleSearch(e.target.value));
        document.addEventListener('click', (e) => {
            if (!elements.searchInput.contains(e.target) && !elements.searchResults.contains(e.target)) {
                elements.searchResults.classList.add('hidden');
            }
        });
        elements.searchInput.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') { elements.searchResults.classList.add('hidden'); elements.searchInput.blur(); }
        });

        window.addEventListener('DOMContentLoaded', initApp);

        // --- Register Service Worker ---
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(() => {
                        console.log('Service Worker registered successfully.');
                    })
                    .catch((error) => {
                        console.error('Service Worker registration failed:', error);
                    });
            });
        }
    </script>
</body>
</html>
