<svg xmlns="http://www.w3.org/2000/svg"
     width="1400"
     height="850"
     viewBox="0 0 1400 850"
     fill="none">

  <defs>

    <linearGradient id="deviceGradient"
      x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00E5FF"/>
      <stop offset="0.5" stop-color="#007BFF"/>
      <stop offset="1" stop-color="#6C4DFF"/>
    </linearGradient>

    <linearGradient id="powerGradient"
      x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFD60A"/>
      <stop offset="1" stop-color="#FF9500"/>
    </linearGradient>

    <linearGradient id="inputGradient"
      x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF3B30"/>
      <stop offset="1" stop-color="#FF2D55"/>
    </linearGradient>

    <linearGradient id="outputGradient"
      x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#30D158"/>
      <stop offset="1" stop-color="#00FF85"/>
    </linearGradient>

    <filter id="blueGlow"
      x="-50%" y="-50%"
      width="200%" height="200%">
      <feGaussianBlur
        stdDeviation="10"
        result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="yellowGlow"
      x="-50%" y="-50%"
      width="200%" height="200%">
      <feGaussianBlur
        stdDeviation="8"
        result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="greenGlow"
      x="-50%" y="-50%"
      width="200%" height="200%">
      <feGaussianBlur
        stdDeviation="8"
        result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

  </defs>


  <!-- INPUT SIGNAL -->

  <g
    stroke="url(#inputGradient)"
    stroke-width="12"
    stroke-linecap="round"
    stroke-linejoin="round">

    <path d="M120 425 H390"/>

    <path d="M390 425 L350 400"/>
    <path d="M390 425 L350 450"/>

  </g>


  <!-- EXTERNAL POWER SUPPLY -->

  <g
    stroke="url(#powerGradient)"
    stroke-width="12"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#yellowGlow)">

    <path d="M700 120 V235"/>

    <path d="M670 120 H730"/>

    <path d="M680 85 H720"/>

    <path d="M690 55 H710"/>

    <path d="M700 235 L675 195"/>
    <path d="M700 235 L725 195"/>

  </g>


  <!-- ACTIVE DEVICE -->

  <g filter="url(#blueGlow)">

    <rect
      x="390"
      y="270"
      width="620"
      height="310"
      rx="42"
      fill="url(#deviceGradient)"
      fill-opacity="0.16"
      stroke="url(#deviceGradient)"
      stroke-width="10"/>

    <rect
      x="425"
      y="305"
      width="550"
      height="240"
      rx="28"
      stroke="#FFFFFF"
      stroke-width="4"
      stroke-opacity="0.65"/>

  </g>


  <!-- DEVICE SYMBOL -->

  <g
    stroke="#FFFFFF"
    stroke-width="9"
    stroke-linecap="round"
    stroke-linejoin="round">

    <path d="M585 425 H655"/>

    <path d="M655 425 L700 380"/>
    <path d="M655 425 L700 470"/>

    <path d="M700 380 V470"/>

    <path d="M700 380 H790"/>
    <path d="M700 470 H790"/>

    <path d="M790 380 V470"/>

    <path d="M790 425 H845"/>

  </g>


  <!-- OUTPUT SIGNAL -->

  <g
    stroke="url(#outputGradient)"
    stroke-width="12"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#greenGlow)">

    <path d="M1010 425 H1280"/>

    <path d="M1280 425 L1240 400"/>
    <path d="M1280 425 L1240 450"/>

  </g>


  <!-- POWER CONNECTION TO DEVICE -->

  <path
    d="M700 235 V270"
    stroke="url(#powerGradient)"
    stroke-width="12"
    stroke-linecap="round"/>


  <!-- INPUT LABEL -->

  <text
    x="115"
    y="360"
    fill="#FF3B30"
    font-family="Arial, Helvetica, sans-serif"
    font-size="38"
    font-weight="700">

    Input Signal

  </text>

  <text
    x="145"
    y="405"
    fill="#FF6B6B"
    font-family="Arial, Helvetica, sans-serif"
    font-size="27"
    font-weight="600">

    Control

  </text>


  <!-- POWER LABEL -->

  <text
    x="535"
    y="65"
    fill="#FFD60A"
    font-family="Arial, Helvetica, sans-serif"
    font-size="36"
    font-weight="700">

    External Power Supply

  </text>


  <!-- DEVICE LABEL -->

  <text
    x="545"
    y="335"
    fill="#FFFFFF"
    font-family="Arial, Helvetica, sans-serif"
    font-size="34"
    font-weight="700">

    ACTIVE DEVICE

  </text>

  <text
    x="530"
    y="525"
    fill="#FFFFFF"
    font-family="Arial, Helvetica, sans-serif"
    font-size="28"
    font-weight="500">

    Controls output using external power

  </text>


  <!-- OUTPUT LABEL -->

  <text
    x="1050"
    y="360"
    fill="#30D158"
    font-family="Arial, Helvetica, sans-serif"
    font-size="38"
    font-weight="700">

    Output Signal

  </text>

  <text
    x="1080"
    y="405"
    fill="#66FF99"
    font-family="Arial, Helvetica, sans-serif"
    font-size="27"
    font-weight="600">

    Controlled Output

  </text>


  <!-- TITLE -->

  <text
    x="445"
    y="720"
    fill="#FFFFFF"
    font-family="Arial, Helvetica, sans-serif"
    font-size="52"
    font-weight="800">

    Active Component

  </text>

  <text
    x="405"
    y="775"
    fill="#A7F3FF"
    font-family="Arial, Helvetica, sans-serif"
    font-size="30"
    font-weight="500">

    Input controls output with energy from an external source

  </text>

</svg>